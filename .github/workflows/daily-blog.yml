name: Daily AI Blog Post

# Publishes one AI-written article every night at 23:30 Beijing time (15:30 UTC).
# The content agent picks the topic, drafts it, fact-checks it, and
# auto-merges the pull request — no human in the loop. If the fact-check flags
# a hard error the run opens a "NEEDS REVIEW" PR instead of publishing.
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch: {}   # manual "Run workflow" button for testing

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger content agent (auto-publish)
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "::error::ADMIN_TOKEN secret is not set. Add it in repo Settings > Secrets > Actions."
            exit 1
          fi
          echo "Calling content agent at $(date -u)…"
          curl -sS -X POST \
            "https://stagelumen.pages.dev/api/content" \
            -H "authorization: Bearer ${ADMIN_TOKEN}" \
            -H "content-type: application/json" \
            -d '{"auto":true}' \
            -o /tmp/content-resp.json
          echo "---- response ----"
          cat /tmp/content-resp.json
          echo
          # Surface the outcome in the run log.
          node -e '
            const r = JSON.parse(require("fs").readFileSync("/tmp/content-resp.json","utf8"));
            if (r.merged) console.log("PUBLISHED:", r.published);
            else if (r.needsReview) console.log("NEEDS REVIEW (fact-check failed):", r.pr && r.pr.url);
            else if (r.pr) console.log("PR opened:", r.pr.url);
            else console.log("No publish. autoSkipped:", r.autoSkipped || "unknown");
          '

      # Tell Bing about the new post instead of waiting for the crawler to find
      # it. Only runs when this scheduled run actually published something
      # (auto-merge clean); the key file is permanently live, so the only wait
      # needed is for Cloudflare Pages to finish building the commit.
      - name: Ping IndexNow for the new post
        if: always()
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ ! -f /tmp/content-resp.json ]; then
            echo "no content response — nothing to submit"
            exit 0
          fi
          URL=$(node -e '
            const fs = require("fs");
            try {
              const r = JSON.parse(fs.readFileSync("/tmp/content-resp.json","utf8"));
              if (r.published) console.log(r.published);
            } catch (e) {}
          ')
          if [ -z "$URL" ]; then
            echo "nothing published this run — IndexNow not called"
            exit 0
          fi
          echo "published: $URL"
          echo "waiting 180s for the Pages deployment to go live…"
          sleep 180
          curl -sS -X POST "https://www.rigebalighting.com/api/indexnow" \
            -H "authorization: Bearer ${ADMIN_TOKEN}" \
            -H "content-type: application/json" \
            -d "{\"urls\":[\"${URL}\"]}" \
            -o /tmp/indexnow-resp.json \
            || echo "::warning::IndexNow request failed (non-fatal — the post is already live)"
          echo "---- indexnow response ----"
          cat /tmp/indexnow-resp.json 2>/dev/null || true
          echo
