<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Leads — RiGeBa Lighting AI</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#171d2b; --line:#232b3d;
    --txt:#e6ebf5; --dim:#8b96ad; --brand:#ff6b00; --cyan:#00d4ff;
    --green:#16a34a; --red:#e5484d; --amber:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--cyan);text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#1c2536;color:var(--dim);border:1px solid var(--line)}
  .spacer{flex:1}
  button,select,input,textarea{font:inherit;color:var(--txt);background:var(--panel2);
       border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer;background:#1c2536}
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.danger{background:transparent;border-color:#7a2b2b;color:#ff8080}
  button.danger:hover{border-color:#ff5a5a;color:#ff5a5a}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card .n{font-size:24px;font-weight:700}
  .card .l{font-size:12px;color:var(--dim);margin-top:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--dim);font-weight:600;background:var(--panel2);text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#151b28}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:#1c2536}
  .pill.hot{color:#fff;background:var(--red);border-color:var(--red)}
  .pill.warm{color:#fff;background:var(--amber);border-color:var(--amber)}
  .pill.nurture{color:var(--dim)}
  .pill.spam{color:#fff;background:#4b5563;border-color:#4b5563}
  .score{font-weight:700}
  .msg{max-width:340px;color:var(--dim);font-size:13px;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);
          transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:22px;z-index:50}
  .drawer.open{transform:none}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:12px 0}
  .kv dt{color:var(--dim);font-size:12px}
  .kv dd{margin:0;word-break:break-word}
  pre{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--line);
      border-radius:10px;padding:12px;font-size:13px;margin:8px 0 0}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .muted{color:var(--dim)}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
  .overlay.open{display:block}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  @media(max-width:720px){ .hide-sm{display:none} }
  /* Bulk-select column: the shared input rule gives every field 8px padding,
     which makes a checkbox look like a button. */
  th input[type=checkbox], td input[type=checkbox]{width:auto;margin:0;padding:0}
  td .pitem a{word-break:break-all}

  .anav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
        padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .anav a{padding:6px 11px;border-radius:7px;background:#1c2536;border:1px solid var(--line);
          color:var(--dim);font-size:13px}
  .anav a:hover{border-color:var(--brand);color:var(--txt)}
  .anav a.on{background:rgba(255,107,0,.15);border-color:var(--brand);color:var(--brand);font-weight:600}
  .anav .spacer{flex:1}
  .anav .home{background:transparent;border-color:transparent}

  /* quote-list column + drawer item cards */
  .prodwrap{display:flex;align-items:center;gap:9px;min-width:0}
  .pthumb{width:38px;height:38px;flex:0 0 38px;object-fit:cover;border-radius:7px;
          background:#0c1322;display:flex;align-items:center;justify-content:center}
  .pthumb-ph{font-size:17px;color:var(--brand)}
  .prodtext{min-width:0}
  .pmodel{font-size:12px;font-weight:600;letter-spacing:.2px;word-break:break-all}
  .psub{font-size:11px;color:var(--dim)}
  .pitem{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);
         border-radius:10px;background:var(--panel2)}
  .pitem .pthumb{width:44px;height:44px;flex:0 0 44px}
  .pprice{font-size:12px;color:var(--green);flex:0 0 auto}
</style>
</head>
<body>
<div class="wrap">
  <nav class="anav">
  <a href="index.html">Admin</a><a href="cms.html">CMS Editor</a><a href="leads.html" class="on">Lead Inbox</a><a href="content.html">Content Factory</a><a href="products.html">Product Importer</a><a href="media.html">Image Library</a><a href="analytics.html">Analytics</a>
  <a href="ai-chat.html">AI Conversations</a>
  <span class="spacer"></span>
  <a class="home" href="/">&larr; Back to site</a>
</nav>

  <header>
    <h1>RiGeBa Lighting <span style="color:var(--brand)">AI</span> Leads</h1>
    <span class="badge" id="envBadge">checking…</span>
    <span class="spacer"></span>
    <a class="badge" href="/admin/">← CMS</a>
    <a class="badge" href="/products">Site ↗</a>
    <button id="btnRefresh">Refresh</button>
    <button id="btnToken">Token</button>
  </header>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <select id="fStatus">
      <option value="all">All status</option>
      <option value="new">New</option>
      <option value="contacted">Contacted</option>
      <option value="qualified">Qualified</option>
      <option value="quoted">Quoted</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
      <option value="spam">Spam</option>
    </select>
    <select id="fStage">
      <option value="all">All stages</option>
      <option value="hot">Hot</option>
      <option value="warm">Warm</option>
      <option value="nurture">Nurture</option>
      <option value="spam">Spam</option>
    </select>
    <select id="fDays">
      <option value="0">All time</option>
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="90">Last 90 days</option>
    </select>
    <input id="fQ" placeholder="Search email / company / name / model / message…" style="min-width:240px" />
    <button id="btnSearch" class="primary">Apply</button>
    <button id="btnExport" title="Exports every row matching the current filters">Export CSV</button>
    <button id="btnSpam" class="danger" disabled>Mark spam (0)</button>
    <button id="btnBulkDelete" class="danger" disabled>Delete (0)</button>
    <span class="spacer" style="flex:1"></span>
    <span class="muted" id="count"></span>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:32px"><input type="checkbox" id="chkAll" title="Select all" /></th>
        <th>Score</th><th>Contact</th><th>Company</th><th>Products</th><th class="hide-sm">Country</th>
        <th>Message</th><th class="hide-sm">Intent</th><th>Status</th><th class="hide-sm">When</th><th></th>
      </tr>
    </thead>
    <tbody id="tbody"><tr><td colspan="11" class="empty">Loading…</td></tr></tbody>
  </table>

  <div class="bar" style="margin-top:14px">
    <button id="btnMore" style="display:none">Load more</button>
    <span class="muted" id="pageInfo"></span>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div style="display:flex;align-items:center;gap:10px">
    <strong id="dTitle">Lead</strong><span class="spacer" style="flex:1"></span>
    <button id="dClose">Close</button>
  </div>
  <div id="dBody"></div>
</div>

<script>
(function(){
  'use strict';
  var TOKEN_KEY = 'sl_admin_token';
  var token = localStorage.getItem(TOKEN_KEY) || '';
  var current = null;
  var rows = [];
  var offset = 0;
  var total = 0;
  var PAGE = 50;
  var selected = {};

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function kb(n){
    var v = Number(n)||0;
    if (v >= 1024*1024) return (v/1024/1024).toFixed(1)+' MB';
    if (v >= 1024) return Math.round(v/1024)+' KB';
    return v+' B';
  }
  /* Quote basket (leads.items) with a graceful fallback to the older flat
     columns, so leads captured before the basket existed still show something. */
  function itemsOf(l){
    try {
      var arr = JSON.parse(l.items || '[]');
      if (Array.isArray(arr) && arr.length) {
        return arr.filter(function(it){ return it && it.model; });
      }
    } catch (e) {}
    if (l.sku || l.product_name) {
      return [{ model: l.sku || '', name: l.product_name || '', qty: 1,
                image: l.product_image || '', category: l.product_category || '', price: null }];
    }
    return [];
  }
  function filesOf(l){
    try {
      var arr = JSON.parse(l.attachments || '[]');
      if (Array.isArray(arr)) return arr.filter(function(f){ return f && f.key; });
    } catch (e) {}
    return [];
  }
  function thumb(it){
    if (it && it.image) return '<img class="pthumb" src="' + esc(it.image) + '" alt="" loading="lazy" />';
    return '<span class="pthumb pthumb-ph">◉</span>';
  }
  function prodCell(l){
    var items = itemsOf(l);
    if (!items.length) return '<span class="muted" style="font-size:12px">general enquiry</span>';
    var totalUnits = items.reduce(function(a, b){ return a + (Number(b.qty) || 0); }, 0);
    return '<div class="prodwrap">' + thumb(items[0]) +
      '<div class="prodtext"><div class="pmodel">' + esc(items[0].model || '—') + '</div>' +
      '<div class="psub">' + (items.length > 1 ? '+' + (items.length - 1) + ' more · ' : '') +
      totalUnits + ' unit' + (totalUnits === 1 ? '' : 's') + '</div></div></div>';
  }
  function prodBlock(l){
    var items = itemsOf(l);
    if (!items.length) {
      return '<span class="muted">' +
        esc([l.product_name, l.category, l.sku].filter(Boolean).join(' / ') || 'general enquiry') + '</span>';
    }
    var totalUnits = items.reduce(function(a, b){ return a + (Number(b.qty) || 0); }, 0);
    return '<div style="display:grid;gap:8px">' + items.map(function(it){
      var href = 'product-detail.html?id=' + encodeURIComponent(String(it.model || '').toLowerCase());
      return '<div class="pitem">' + thumb(it) +
        '<div style="min-width:0;flex:1">' +
          '<div><a href="/' + href + '" target="_blank" rel="noopener"><strong>' + esc(it.model) + '</strong></a>' +
          ' <span class="pill">x' + esc(Number(it.qty) || 1) + '</span></div>' +
          '<div class="muted" style="font-size:12px">' + esc(it.name || '') + '</div>' +
        '</div>' +
        (it.price ? '<div class="pprice">$' + esc(it.price) + '</div>' : '') +
      '</div>';
    }).join('') +
    '<div class="muted" style="font-size:12px">' + items.length + ' item' + (items.length>1?'s':'') +
    ' · ' + totalUnits + ' units total</div></div>';
  }
  /* Attachments live in R2 and are only reachable through the token-protected
     download route, so the link must carry the token the browser already has. */
  function attachBlock(l){
    var files = filesOf(l);
    if (!files.length) return '<span class="muted">none</span>';
    return '<div style="display:grid;gap:6px">' + files.map(function(f){
      return '<div class="pitem"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">' +
        '<a href="/api/upload?key=' + encodeURIComponent(f.key) + '&token=' + encodeURIComponent(token) +
        '" target="_blank" rel="noopener">' + esc(f.name || f.key) + '</a></span>' +
        '<span class="muted" style="font-size:12px">' + kb(f.size) + '</span></div>';
    }).join('') + '</div>';
  }
  // notified is a bitmask: 1 = email, 2 = webhook, 4 = github issue
  function notifyLabel(m){
    m = m|0;
    if (!m) return '<span class="pill" style="color:var(--red);border-color:rgba(229,72,77,.5)">none</span>';
    var p = [];
    if (m & 1) p.push('email');
    if (m & 2) p.push('webhook');
    if (m & 4) p.push('github');
    return '<span class="pill" style="color:var(--green)">' + esc(p.join('+')) + '</span>';
  }
  // autoreply_sent: 0 none / 1 sent / 2 failed / 3 skipped by rate limit
  function autoLabel(v){
    v = v|0;
    var t = '↩ ';
    if (v === 1) return '<span class="pill" style="color:var(--green)">' + t + 'replied</span>';
    if (v === 2) return '<span class="pill" style="color:var(--red)">' + t + 'failed</span>';
    if (v === 3) return '<span class="pill" style="color:var(--amber)">' + t + 'skipped</span>';
    return '<span class="pill" style="color:var(--dim)">' + t + 'none</span>';
  }
  function notifyTitle(m){
    m = m|0;
    if (!m) return 'No notification was delivered for this lead';
    var p = [];
    if (m & 1) p.push('email');
    if (m & 2) p.push('webhook');
    if (m & 4) p.push('GitHub issue');
    return 'Delivered via ' + p.join(', ');
  }
  /* GDPR: the stored timestamp is the proof, so show it plainly instead of
     hiding it in the raw JSON. */
  function consentLine(l){
    if (!l.consent_at) {
      return '<span class="muted">not recorded</span>' +
        (l.created_at && l.created_at < '2026-09-27' ? ' <span class="muted">(pre-dates consent logging)</span>' : '');
    }
    return '<span class="pill" style="color:var(--green)">opted in</span> ' +
      esc(l.consent_at) + ' <span class="muted">· policy ' + esc(l.consent_ver || '-') + '</span>';
  }
  function utmLine(l){
    try {
      var u = JSON.parse(l.utm || '{}');
      var parts = [u.utm_source, u.utm_medium, u.utm_campaign].filter(Boolean);
      if (parts.length) return parts.join(' / ');
      if (u.gclid || u.fbclid) return 'paid click (' + (u.gclid ? 'google' : 'meta') + ')';
      if (u.ref) return 'referrer: ' + String(u.ref).slice(0, 90);
    } catch (e) {}
    return '—';
  }
  function ago(ts){
    if(!ts) return '-';
    var t = new Date(String(ts).replace(' ','T') + 'Z').getTime();
    if (isNaN(t)) return String(ts).slice(0,16);
    var d = Math.floor((Date.now()-t)/1000);
    if (d<60) return d+'s ago';
    if (d<3600) return Math.floor(d/60)+'m ago';
    if (d<86400) return Math.floor(d/3600)+'h ago';
    return Math.floor(d/86400)+'d ago';
  }
  function api(path, opts){
    opts = opts || {};
    var h = { 'content-type':'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return fetch(path, { method: opts.method||'GET', headers:h, body: opts.body })
      .then(function(r){
        if (r.status === 401) { askToken(true); throw new Error('Unauthorized'); }
        return r.json().catch(function(){ return {}; });
      });
  }
  function askToken(force){
    if (!force && token) return;
    var v = prompt('Enter ADMIN_TOKEN (stored in this browser only):', token || '');
    if (v === null) return;
    token = v.trim();
    localStorage.setItem(TOKEN_KEY, token);
    load();
  }

  function renderCards(s){
    if (!s) { $('cards').innerHTML = ''; return; }
    var items = [
      ['Leads (' + s.days + 'd)', s.in_window, ''],
      ['🔥 Hot', s.hot, 'color:var(--red)'],
      ['Won', s.won, 'color:var(--green)'],
      ['Conversion', s.conversion + '%', ''],
      ['Avg score', s.avg_score, ''],
      ['Spam blocked', s.spam, 'color:var(--dim)']
    ];
    $('cards').innerHTML = items.map(function(it){
      return '<div class="card"><div class="n" style="' + it[2] + '">' + esc(it[1]) +
             '</div><div class="l">' + esc(it[0]) + '</div></div>';
    }).join('');
  }

  function render(){
    var tb = $('tbody');
    if (!rows.length){
      tb.innerHTML = '<tr><td colspan="11" class="empty">No leads match these filters.</td></tr>';
      return;
    }
    tb.innerHTML = rows.map(function(l){
      var scoreColor = l.score>=70 ? 'var(--red)' : l.score>=45 ? 'var(--amber)' : 'var(--dim)';
      var files = filesOf(l);
      return '<tr data-id="' + esc(l.id) + '">' +
        '<td><input type="checkbox" data-pick="' + esc(l.id) + '"' + (selected[l.id] ? ' checked' : '') + ' /></td>' +
        '<td class="score" style="color:' + scoreColor + '">' + esc(l.score) + '</td>' +
        '<td><div>' + esc(l.name || '—') + '</div><div class="muted" style="font-size:12px">' + esc(l.email) + '</div></td>' +
        '<td>' + esc(l.company || '—') + '</td>' +
        '<td>' + prodCell(l) + '</td>' +
        '<td class="hide-sm">' + esc(l.country || '—') + '</td>' +
        '<td class="msg">' + esc(l.raw_text || '—') + '</td>' +
        '<td class="hide-sm"><span class="pill">' + esc(l.intent || '-') + '</span></td>' +
        '<td><span class="pill ' + esc(l.stage || '') + '">' + esc(l.status || 'new') + '</span></td>' +
        '<td class="hide-sm" title="' + esc(notifyTitle(l.notified)) + '">' + notifyLabel(l.notified) + ' ' + autoLabel(l.autoreply_sent) + '</td>' +
        '<td class="hide-sm muted">' + ago(l.created_at) + '</td>' +
        '<td style="white-space:nowrap"><button data-open="' + esc(l.id) + '">Open</button>' +
        (files.length ? ' <span class="pill" title="' + esc(files.map(function(f){ return f.name; }).join(', ')) + '">📎' + files.length + '</span>' : '') +
        '</td>' +
      '</tr>';
    }).join('');
  }

  function filterQs(){
    var qs = [];
    var st = $('fStatus').value; if (st !== 'all') qs.push('status=' + encodeURIComponent(st));
    var sg = $('fStage').value;  if (sg !== 'all') qs.push('stage=' + encodeURIComponent(sg));
    var dy = $('fDays').value;   if (dy && dy !== '0') qs.push('days=' + encodeURIComponent(dy));
    var q  = $('fQ').value.trim(); if (q) qs.push('q=' + encodeURIComponent(q));
    return qs;
  }

  function load(more){
    if (!more) { offset = 0; rows = []; }
    if (!more) $('tbody').innerHTML = '<tr><td colspan="11" class="empty">Loading…</td></tr>';

    var qs = filterQs().concat(['limit=' + PAGE, 'offset=' + offset]);

    api('/api/leads?' + qs.join('&')).then(function(d){
      if (!d.ok) { $('tbody').innerHTML = '<tr><td colspan="11" class="empty">' + esc(d.error||'error') + '</td></tr>'; return; }
      rows = more ? rows.concat(d.leads || []) : (d.leads || []);
      total = d.total || rows.length;
      offset = rows.length;
      render();
      updateBulk();
      $('count').textContent = rows.length + ' shown / ' + total + ' matching';
      var moreLeft = rows.length < total;
      $('btnMore').style.display = moreLeft ? '' : 'none';
      $('btnMore').textContent = 'Load ' + Math.min(PAGE, total - rows.length) + ' more';
      $('pageInfo').textContent = moreLeft ? '' : (rows.length ? 'End of list.' : '');
    }).catch(function(e){
      $('tbody').innerHTML = '<tr><td colspan="11" class="empty">' + esc(e.message) + '</td></tr>';
    });

    api('/api/stats?days=30').then(function(d){ if (d.ok) renderCards(d); }).catch(function(){});
  }

  function updateBulk(){
    var ids = Object.keys(selected).filter(function(k){ return selected[k]; });
    $('btnSpam').disabled = !ids.length;
    $('btnBulkDelete').disabled = !ids.length;
    $('btnSpam').textContent = 'Mark spam (' + ids.length + ')';
    $('btnBulkDelete').textContent = 'Delete (' + ids.length + ')';
  }

  function selectedIds(){
    return Object.keys(selected).filter(function(k){ return selected[k]; });
  }

  /* Sequential on purpose: a burst of parallel writes on one D1 instance is
     how you get a 429 from your own rate limiter, and a half-applied batch is
     harder to reason about than a slow one. */
  function runBatch(ids, fn, btn, label, done){
    var i = 0;
    (function next(){
      if (i >= ids.length) { done(); return; }
      btn.textContent = label + ' ' + (i + 1) + '/' + ids.length + '…';
      fn(ids[i]).then(function(){ i++; next(); }).catch(function(){ i++; next(); });
    })();
  }

  function openLead(id){
    api('/api/lead?id=' + encodeURIComponent(id)).then(function(d){
      if (!d.ok) { alert(d.error || 'Failed'); return; }
      current = d.lead;
      var l = d.lead;
      $('dTitle').textContent = (l.company || l.name || 'Lead') + '  ·  ' + l.score + '/100';
      var notes = (d.notes||[]).map(function(n){
        return '<div style="border-top:1px solid var(--line);padding:8px 0">' +
               '<div class="muted" style="font-size:12px">' + esc(n.author) + ' · ' + ago(n.created_at) + '</div>' +
               '<div>' + esc(n.note) + '</div></div>';
      }).join('');

      $('dBody').innerHTML =
        '<dl class="kv">' +
        '<dt>Name</dt><dd>' + esc(l.name||'-') + '</dd>' +
        '<dt>Email</dt><dd><a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a></dd>' +
        '<dt>Phone</dt><dd>' + esc(l.phone||'-') + '</dd>' +
        '<dt>Company</dt><dd>' + esc(l.company||'-') + '</dd>' +
        '<dt>Country</dt><dd>' + esc(l.country||'-') + '</dd>' +
        '<dt>Products</dt><dd>' + prodBlock(l) + '</dd>' +
        '<dt>Qty / Budget</dt><dd>' + esc([l.qty, l.budget].filter(Boolean).join('  ·  ')||'-') + '</dd>' +
        '<dt>Lead time</dt><dd>' + esc(l.lead_time||'-') + '</dd>' +
        '<dt>Trade terms</dt><dd>' + esc(l.trade_terms||'-') + '</dd>' +
        '<dt>Attachments</dt><dd>' + attachBlock(l) + '</dd>' +
        '<dt>Consent</dt><dd>' + consentLine(l) + '</dd>' +
        '<dt>Intent</dt><dd>' + esc(l.intent) + ' · ' + esc(l.urgency) + '</dd>' +
        '<dt>Alert</dt><dd>' + notifyLabel(l.notified) + ' <span class="muted">' + esc(notifyTitle(l.notified)) + '</span></dd>' +
        '<dt>Ack to customer</dt><dd>' + autoLabel(l.autoreply_sent) + '</dd>' +
        '<dt>Language</dt><dd>' + esc(l.lang || '-') + '</dd>' +
        '<dt>Campaign</dt><dd>' + esc(utmLine(l)) + '</dd>' +
        '<dt>Source</dt><dd class="muted">' + esc((l.page_url||'').slice(0,120)) + '</dd>' +
        '<dt>IP / UA</dt><dd class="muted" style="font-size:12px">' + esc(l.ip||'-') + '<br>' + esc(String(l.ua||'').slice(0,90)) + '</dd>' +
        '<dt>Received</dt><dd>' + esc(l.created_at) + '</dd>' +
        '</dl>' +
        '<div><strong>Customer message</strong><pre>' + esc(l.raw_text||'-') + '</pre></div>' +
        (l.ai_summary ? '<div><strong>AI summary</strong><pre>' + esc(l.ai_summary) + '</pre></div>' : '') +
        (l.ai_reply ? '<div><strong>Drafted reply</strong><pre>' + esc(l.ai_reply) + '</pre>' +
          '<button id="btnCopy" style="margin-top:8px">Copy reply</button></div>' : '') +
        '<div><strong>Notes</strong>' + (notes || '<div class="muted">No notes yet.</div>') + '</div>' +
        '<textarea id="noteBox" placeholder="Add a note…" style="width:100%;margin-top:10px" rows="3"></textarea>' +
        '<div class="row-actions">' +
          '<button id="btnAutoReply">Reply to customer</button>' +
          '<button id="btnNotify">Resend alert</button>' +
          '<button data-status="contacted">Mark contacted</button>' +
          '<button data-status="qualified">Qualified</button>' +
          '<button data-status="quoted">Quoted</button>' +
          '<button data-status="won" class="primary">Won</button>' +
          '<button data-status="lost">Lost…</button>' +
          '<button id="btnDelete" class="danger" style="margin-left:auto">Delete</button>' +
        '</div>';

      $('drawer').classList.add('open');
      $('overlay').classList.add('open');
    }).catch(function(e){ alert(e.message); });
  }

  function patch(body){
    if (!current) return;
    api('/api/lead?id=' + encodeURIComponent(current.id), {
      method:'PATCH', body: JSON.stringify(body)
    }).then(function(d){
      if (!d.ok) { alert(d.error || 'Update failed'); return; }
      $('drawer').classList.remove('open');
      $('overlay').classList.remove('open');
      load();
    }).catch(function(e){ alert(e.message); });
  }

  // ---- events ------------------------------------------------------------
  $('btnRefresh').onclick = function(){ load(); };
  $('btnToken').onclick = function(){ askToken(true); };
  $('btnSearch').onclick = function(){ load(); };
  $('fQ').addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
  $('fStatus').addEventListener('change', function(){ load(); });
  $('fStage').addEventListener('change', function(){ load(); });
  $('fDays').addEventListener('change', function(){ load(); });
  $('dClose').onclick = function(){ $('drawer').classList.remove('open'); $('overlay').classList.remove('open'); };
  $('overlay').onclick = function(){ $('drawer').classList.remove('open'); $('overlay').classList.remove('open'); };
  $('btnMore').onclick = function(){ load(true); };

  $('chkAll').onchange = function(){
    var on = this.checked;
    rows.forEach(function(l){ selected[l.id] = on; });
    render();
    updateBulk();
  };

  /* CSV runs through the same filters as the table, so what you see is what
     you export. Served by the API (not assembled in the browser) because the
     browser only ever holds one page of rows. */
  $('btnExport').onclick = function(){
    if (!token) { alert('Enter your admin token first (Token button).'); return; }
    var qs = filterQs().concat(['format=csv', 'token=' + encodeURIComponent(token)]);
    window.location.href = '/api/leads?' + qs.join('&');
  };

  $('btnSpam').onclick = function(){
    var ids = selectedIds();
    if (!ids.length) return;
    if (!confirm('Mark ' + ids.length + ' lead(s) as spam?\n\nThey stay in the database but leave the working list.')) return;
    this.disabled = true;
    var self = this;
    runBatch(ids, function(id){
      return api('/api/lead?id=' + encodeURIComponent(id), { method:'PATCH', body: JSON.stringify({ status: 'spam' }) });
    }, this, 'Spamming', function(){
      selected = {};
      load();
    });
  };

  $('btnBulkDelete').onclick = function(){
    var ids = selectedIds();
    if (!ids.length) return;
    if (!confirm('Permanently delete ' + ids.length + ' lead(s)?\n\nThis also deletes their uploaded files and cannot be undone.')) return;
    this.disabled = true;
    runBatch(ids, function(id){
      return api('/api/lead?id=' + encodeURIComponent(id), { method:'DELETE' });
    }, this, 'Deleting', function(){
      selected = {};
      load();
    });
  };

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t || !t.getAttribute) return;

    var pick = t.getAttribute('data-pick');
    if (pick !== null) { selected[pick] = !!t.checked; updateBulk(); return; }

    var openId = t.getAttribute('data-open');
    if (openId) { openLead(openId); return; }

    if (t.id === 'btnCopy' && current){
      navigator.clipboard.writeText(current.ai_reply || '');
      t.textContent = 'Copied ✓';
      return;
    }

    if (t.id === 'btnDelete' && current){
      var who = current.email || current.id;
      if (!confirm('Permanently delete this lead?\n\n' + who + '\n\nThis cannot be undone.')) return;
      api('/api/lead?id=' + encodeURIComponent(current.id), { method:'DELETE' })
        .then(function(d){
          if (!d.ok) { alert(d.error || 'Delete failed'); return; }
          $('drawer').classList.remove('open');
          $('overlay').classList.remove('open');
          current = null;
          load();
        }).catch(function(e){ alert(e.message); });
      return;
    }

    if (t.id === 'btnAutoReply' && current){
      var again = (current.autoreply_sent|0) === 1;
      if (!confirm('Send the acknowledgement email to ' + (current.email || 'this address') +
          '?\n\nIt uses the draft reply shown above.' +
          (again ? '\n\nAlready acknowledged once — sending again.' : ''))) return;
      t.disabled = true; t.textContent = 'Sending…';
      api('/api/lead?id=' + encodeURIComponent(current.id), {
        method:'PATCH', body: JSON.stringify({ autoReply:true, force: again })
      }).then(function(d){
        if (!d.ok){ alert('Not sent: ' + (d.error || 'unknown error')); }
        else {
          var a = d.auto_reply || {};
          alert(a.ok
            ? 'Acknowledgement sent to ' + (current.email) + '\nResend id: ' + (a.id || '-')
            : 'Not sent: ' + (a.reason || 'unknown') + (a.hint ? '\n\n' + a.hint : ''));
        }
        t.disabled = false; t.textContent = 'Reply to customer';
        var id = current.id;
        load();
        openLead(id);
      }).catch(function(e){ alert(e.message); t.disabled = false; t.textContent = 'Reply to customer'; });
      return;
    }

    if (t.id === 'btnNotify' && current){
      t.disabled = true; t.textContent = 'Sending…';
      api('/api/lead?id=' + encodeURIComponent(current.id), { method:'PATCH', body: JSON.stringify({ notify:true }) })
        .then(function(d){
          if (!d.ok){ alert('Resend failed: ' + (d.error || 'unknown error')); }
          else {
            var n = d.notify || {};
            alert('Resend result\n\n  email:  ' + (n.email ? 'sent' : 'not sent') +
                  '\n  webhook: ' + (n.webhook ? 'sent' : 'not sent') +
                  '\n  github:  ' + (n.github ? 'issue created' : 'not created') +
                  '\n\nIf all three are negative, no channel is configured on Cloudflare.');
          }
          t.disabled = false; t.textContent = 'Resend alert';
          var id = current.id;
          load();
          openLead(id);
        }).catch(function(e){ alert(e.message); t.disabled = false; t.textContent = 'Resend alert'; });
      return;
    }

    var st = t.getAttribute('data-status');
    if (st && current){
      var body = { status: st, note: ($('noteBox') && $('noteBox').value.trim()) || '' };
      if (st === 'lost'){
        var why = prompt('Why did we lose this deal? (required — this feeds the data flywheel)');
        if (!why) return;
        body.lostReason = why;
      }
      patch(body);
    }
  });

  api('/api/health').then(function(d){
    var b = d.bindings || {};
    var missing = [];
    if (!b.DB) missing.push('DB');
    if (!b.ADMIN_TOKEN) missing.push('ADMIN_TOKEN');
    if (!b.AI) missing.push('AI');
    var nt = d.notify || {};
    if (!(nt.email && nt.email.configured) && !(nt.webhook && nt.webhook.configured) && !(nt.github_issue && nt.github_issue.configured)) {
      missing.push('notify channel');
    }
    var extra = b.UPLOADS ? '' : ' · uploads off';
    $('envBadge').textContent = missing.length
      ? 'missing bindings: ' + missing.join(', ') + extra
      : 'all systems go · ' + (d.leads||0) + ' leads' + extra;
    $('envBadge').style.color = missing.length ? 'var(--amber)' : 'var(--green)';
  }).catch(function(){ $('envBadge').textContent = 'api offline'; });

  if (!token) askToken(false); else load();
  load();
})();
</script>
</body>
</html>
