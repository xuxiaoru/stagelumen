# RiGeBa Lighting CMS Configuration
# https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: xuxiaoru/stagelumen
  branch: main
  # Cloudflare Pages OAuth proxy (see functions/admin/api/)
  base_url: https://www.rigebalighting.com
  auth_endpoint: /admin/api/auth

publish_mode: simple
# Enable local_backend only when running `npx decap-server` locally.
# local_backend: true

site_url: https://www.rigebalighting.com
display_url: https://www.rigebalighting.com
logo_url: https://www.rigebalighting.com/assets/images/logo.png

search: true
locale: en

# Media folder — where uploaded images go (must be in repo)
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"
media_library:
  name: uploadcare
  config:
    publicKey: ""

# ============================================
# COLLECTIONS
# ============================================
collections:

  # ---------------------------------------------------------
  # PRODUCTS — Main catalog
  # ---------------------------------------------------------
  # ---------------------------------------------------------
  # PRODUCT CATALOGUE - moved out of this CMS on 2026-10-04.
  #
  # data/products.json is 1.19 MB, and GitHub Content's API refuses to return
  # the body of any file over 1 MB (it answers encoding:"none" with empty
  # content). Decap therefore could not read the catalogue at all and fell back
  # to a slow path, which is why editing here felt unusable.
  #
  # Product data is now edited in /admin/products-editor.html, which writes one
  # product at a time through the git blob API. That path is not size-limited.
  # The catalogue is also no longer listed here at all, so Decap never opens the
  # file - the slowness is gone rather than merely reduced.
  #
  # category labels and the meta defaults (currency, MOQ, lead time) are shown
  # read-only in that editor.
  # ---------------------------------------------------------
  - name: blog
    label: "Blog Posts"
    folder: content/blog
    create: true
    extension: md
    format: yaml-frontmatter
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields:
      - date
      - title
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: slug, label: "URL Slug", widget: string, hint: "kebab-case" }
      - { name: date, label: "Publish Date", widget: datetime }
      - { name: author, label: "Author", widget: string, default: "RiGeBa Lighting Team" }
      - name: category
        label: "Category"
        widget: select
        options:
          - "How-To"
          - "Application"
          - "Customer Story"
          - "Product News"
          - "Industry"
      - { name: coverImage, label: "Cover Image", widget: image, allow_multiple: false }
      - { name: excerpt, label: "Excerpt (160 chars)", widget: text }
      - name: tags
        label: "Tags"
        widget: list
        required: false
        field: { name: tag, widget: string }
      - { name: body, label: "Body", widget: markdown }

  # ---------------------------------------------------------
  # TESTIMONIALS
  # ---------------------------------------------------------
  - name: testimonials
    label: "Customer Testimonials"
    files:
      - name: testimonials
        label: "Testimonials"
        file: content/testimonials.yml
        format: yaml
        fields:
          - name: items
            label: "Testimonials"
            widget: list
            summary: "{{fields.name}} — {{fields.company}}"
            fields:
              - { name: name, label: "Customer Name", widget: string }
              - { name: company, label: "Company / Role", widget: string }
              - { name: country, label: "Country", widget: string, required: false }
              - { name: avatar, label: "Avatar (initials)", widget: string, default: "?" }
              - { name: rating, label: "Stars (1–5)", widget: number, min: 1, max: 5, default: 5 }
              - { name: quote, label: "Quote", widget: text }
              - { name: product, label: "Related Product ID", widget: string, required: false, hint: "e.g. sl-b230" }

  # ---------------------------------------------------------
  # SITE SETTINGS
  # ---------------------------------------------------------
  - name: settings
    label: "Site Settings"
    files:
      - name: settings
        label: "Site Settings"
        file: content/settings.yml
        format: yaml
        fields:
          - { name: brand, label: "Brand Name", widget: string }
          - { name: tagline, label: "Site Tagline", widget: string }
          - { name: companyLegalName, label: "Legal Company Name", widget: string }
          - { name: email, label: "Sales Email", widget: string }
          - { name: phone, label: "Sales Phone", widget: string }
          - { name: mobile, label: "Mobile", widget: string, required: false }
          - { name: wechat, label: "WeChat", widget: string, required: false }
          - { name: ims, label: "IMS", widget: string, required: false }
          - { name: facebook, label: "Facebook", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp Number", widget: string, required: false }
          - { name: salesRep, label: "Sales Contact Name", widget: string, required: false }
          - { name: salesRepTitle, label: "Sales Contact Title", widget: string, required: false }
          - { name: address, label: "Factory Address", widget: string }
          - { name: founded, label: "Founded Year", widget: number, value_type: int }
          - { name: teamSize, label: "Team Size", widget: string }
          - { name: factoryArea, label: "Factory Area (m²)", widget: string }
          - { name: countriesServed, label: "Countries Served", widget: string }
          - { name: skus, label: "Total SKUs", widget: string }
          - { name: primaryColor, label: "Primary Color (HEX)", widget: color, default: "#ff6b00" }
          - { name: accentColor, label: "Accent Color (HEX)", widget: color, default: "#00d4ff" }
          - name: social
            label: "Social Links"
            widget: object
            fields:
              - { name: youtube, label: "YouTube URL", widget: string, required: false }
              - { name: instagram, label: "Instagram URL", widget: string, required: false }
              - { name: facebook, label: "Facebook URL", widget: string, required: false }
              - { name: linkedin, label: "LinkedIn URL", widget: string, required: false }
              - { name: tiktok, label: "TikTok URL", widget: string, required: false }
