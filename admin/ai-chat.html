<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>AI Conversations — StageLumen AI</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#171d2b; --line:#232b3d;
    --txt:#e6ebf5; --dim:#8b96ad; --brand:#ff6b00; --cyan:#00d4ff;
    --green:#16a34a; --red:#e5484d; --amber:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--cyan);text-decoration:none}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:20px;margin:0;letter-spacing:.3px}
  .badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#1c2536;color:var(--dim);border:1px solid var(--line)}
  .spacer{flex:1}
  button,select,input,textarea{font:inherit;color:var(--txt);background:var(--panel2);
       border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button{cursor:pointer;background:#1c2536}
  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.danger{background:transparent;border-color:#7a2b2b;color:#ff8080}
  button.danger:hover{border-color:#ff5a5a;color:#ff5a5a}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card .n{font-size:24px;font-weight:700}
  .card .l{font-size:12px;color:var(--dim);margin-top:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--dim);font-weight:600;background:var(--panel2);text-transform:uppercase;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#151b28}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:#1c2536}
  .pill.quote{color:#fff;background:var(--red);border-color:var(--red)}
  .pill.oem,.pill.sample{color:#fff;background:var(--amber);border-color:var(--amber)}
  .pill.catalog,.pill.aftersales{color:var(--cyan);border-color:var(--cyan)}
  .pill.general{color:var(--dim)}
  .pill.open{color:#fff;background:var(--red);border-color:var(--red)}
  .pill.claimed{color:#fff;background:var(--amber);border-color:var(--amber)}
  .pill.closed,.pill.archived{color:var(--dim)}
  .msg{max-width:420px;color:var(--dim);font-size:13px;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(620px,100%);background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);
          transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:22px;z-index:50}
  .drawer.open{transform:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
  .overlay.open{display:block}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:12px 0}
  .kv dt{color:var(--dim);font-size:12px}
  .kv dd{margin:0;word-break:break-word}
  .thread{margin:14px 0}
  .turn{padding:9px 12px;border-radius:10px;margin-bottom:8px;font-size:13px;white-space:pre-wrap;word-break:break-word}
  .turn.visitor{background:#1c2536;border:1px solid var(--line)}
  .turn.assistant{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.25)}
  .turn .who{font-size:11px;color:var(--dim);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  textarea{width:100%;min-height:70px;resize:vertical}
  .muted{color:var(--dim)}
  .empty{padding:40px;text-align:center;color:var(--dim)}
  .err{background:rgba(229,72,77,.12);border:1px solid #7a2b2b;color:#ff9b9b;padding:10px 12px;border-radius:10px;margin-bottom:14px}
  @media(max-width:720px){ .hide-sm{display:none} }

  .anav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:18px;
        padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .anav a{padding:6px 11px;border-radius:7px;background:#1c2536;border:1px solid var(--line);
          color:var(--dim);font-size:13px}
  .anav a:hover{border-color:var(--brand);color:var(--txt)}
  .anav a.on{background:rgba(255,107,0,.15);border-color:var(--brand);color:var(--brand);font-weight:600}
  .anav .spacer{flex:1}
  .anav .home{background:transparent;border-color:transparent}
</style>
</head>
<body>
<div class="wrap">
  <nav class="anav">
  <a href="index.html">Admin</a><a href="cms.html">CMS Editor</a><a href="leads.html">Lead Inbox</a><a href="content.html">Content Factory</a><a href="products.html">Product Importer</a><a href="media.html">Image Library</a><a href="analytics.html">Analytics</a><a href="ai-chat.html" class="on">AI Conversations</a>
  <span class="spacer"></span>
  <a class="home" href="/">&larr; Back to site</a>
</nav>

  <header>
    <h1>StageLumen <span style="color:var(--brand)">AI</span> Conversations</h1>
    <span class="badge" id="envBadge">checking…</span>
    <span class="spacer"></span>
    <button id="btnRefresh">Refresh</button>
    <button id="btnToken">Token</button>
  </header>

  <div class="cards" id="cards"></div>

  <div class="bar">
    <select id="fStatus">
      <option value="all">All statuses</option>
      <option value="open">Open (needs a human)</option>
      <option value="claimed">Taken over</option>
      <option value="closed">Closed</option>
      <option value="archived">Archived</option>
    </select>
    <input id="fQ" placeholder="Search the transcript…" style="min-width:230px" />
    <span class="spacer"></span>
    <span class="muted" id="retention">Threads auto-convert to a lead after 4 unanswered exchanges. Policy retention: 180 days.</span>
    <input id="purgeDays" type="number" min="30" step="30" value="180" style="width:90px" />
    <button class="danger" id="btnPurge">Purge older</button>
  </div>

  <div id="err"></div>
  <table id="tbl"><tbody><tr><td class="empty">Loading…</td></tr></tbody></table>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer"></div>

<script>
(function(){
  'use strict';
  var TOKEN_KEY = 'sl_admin_token';
  var token = localStorage.getItem(TOKEN_KEY) || '';
  var current = null;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function api(path, opts){
    opts = opts || {};
    var headers = { 'content-type':'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return fetch('/api/admin-chats' + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return { ok:false, error:'HTTP ' + r.status }; });
    });
  }

  function fail(err){
    $('err').innerHTML = '<div class="err">' + esc(err) +
      (token ? '' : ' — set your admin token with the Token button.') + '</div>';
  }

  function pill(v){
    return '<span class="pill ' + esc(v) + '">' + esc(v || '-') + '</span>';
  }

  function load(){
    $('err').innerHTML = '';
    var st = $('fStatus').value, q = $('fQ').value.trim();
    var qs = '?limit=100' + (st && st !== 'all' ? '&status=' + encodeURIComponent(st) : '') +
             (q ? '&q=' + encodeURIComponent(q) : '');
    api(qs).then(function(d){
      if (!d.ok) { fail(d.error || 'Request failed'); return; }
      $('envBadge').textContent = d.counts.open + ' open · ' + d.counts.claimed + ' claimed';
      var c = d.counts;
      $('cards').innerHTML =
        card(c.open, 'Open threads') +
        card(c.hot, 'Buying intent unanswered') +
        card(c.withEmail, 'Visitor left an email') +
        card(c.claimed, 'Taken over') ;
      render(d.sessions);
    }).catch(function(e){ fail(String(e)); });
  }

  function card(n, l){
    return '<div class="card"><div class="n">' + esc(n) + '</div><div class="l">' + esc(l) + '</div></div>';
  }

  function render(rows){
    var b = $('tbl').getElementsByTagName('tbody')[0];
    if (!rows.length){
      b.innerHTML = '<tr><td class="empty">No conversations yet. They will appear here as visitors use the site assistant.</td></tr>';
      return;
    }
    b.innerHTML = '<tr><th class="hide-sm">When</th><th>Intent</th><th class="hide-sm">Score</th>' +
                  '<th class="hide-sm">Msgs</th><th>Contact</th><th>Question</th><th>Status</th><th></th></tr>' +
      rows.map(function(s){
        return '<tr>' +
          '<td class="hide-sm">' + esc(String(s.updated_at || '').slice(5,16)) + '</td>' +
          '<td>' + pill(s.intent) + '</td>' +
          '<td class="hide-sm">' + esc(s.score) + '</td>' +
          '<td class="hide-sm">' + esc(s.msg_count) + '</td>' +
          '<td>' + (s.email ? '<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>'
                            : '<span class="muted">anonymous</span>') + '</td>' +
          '<td class="msg">' + esc(s.preview || '') + '</td>' +
          '<td>' + pill(s.status) + '</td>' +
          '<td><button data-id="' + esc(s.id) + '">Open</button></td>' +
        '</tr>';
      }).join('');

    var btns = b.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) btns[i].onclick = function(){ openThread(this.getAttribute('data-id')); };
  }

  function openThread(id){
    $('err').innerHTML = '';
    api('?id=' + encodeURIComponent(id)).then(function(d){
      if (!d.ok) { fail(d.error || 'Not found'); return; }
      current = d.session;
      show(d.session, d.messages);
    }).catch(function(e){ fail(String(e)); });
  }

  function show(s, msgs){
    var d = $('drawer');
    d.innerHTML = '<div class="row-actions" style="margin-top:0"><button id="dClose">×</button>' +
      '<span class="spacer"></span><span class="muted">' + esc(s.id) + '</span></div>' +
      '<h2 style="font-size:17px;margin:6px 0 0">Conversation</h2>' +
      '<dl class="kv">' +
        '<dt>Started</dt><dd>' + esc(s.created_at) + '</dd>' +
        '<dt>Intent / score</dt><dd>' + pill(s.intent) + ' · ' + esc(s.score) + ' · ' + esc(s.stage) + '</dd>' +
        '<dt>Contact</dt><dd>' + (s.email ? '<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + '</a>'
                                          : '<span class="muted">none given</span>') + '</dd>' +
        '<dt>Page</dt><dd>' + (s.page_url ? '<a href="' + esc(s.page_url) + '" target="_blank" rel="noopener">' +
                               esc(String(s.page_url).slice(0, 90)) + '</a>' : '-') + '</dd>' +
        '<dt>Status</dt><dd>' + pill(s.status) + '</dd>' +
        (s.lead_id ? '<dt>Lead</dt><dd><a href="leads.html">' + esc(s.lead_id) + '</a></dd>' : '') +
      '</dl>' +
      '<div class="thread">' + msgs.map(function(m){
        return '<div class="turn ' + (m.role === 'visitor' ? 'visitor' : 'assistant') + '">' +
               '<span class="who">' + (m.role === 'visitor' ? 'Buyer' : 'Assistant (' + esc(m.model || 'n/a') + ')') + '</span>' +
               esc(m.content) + '</div>';
      }).join('') + '</div>' +
      '<label class="muted">Handled by</label>' +
      '<input id="handledBy" style="width:100%" value="' + esc(s.handled_by || '') + '" placeholder="e.g. Anna" />' +
      '<label class="muted" style="display:block;margin-top:12px">Internal note</label>' +
      '<textarea id="note" placeholder="What did they actually need? Any follow-up promised?">' + esc(s.note || '') + '</textarea>' +
      '<div class="row-actions">' +
        '<button class="primary" id="bClaim">Take over</button>' +
        '<button id="bClose">Close</button>' +
        '<button id="bArchive">Archive</button>' +
        '<span class="spacer"></span>' +
        '<button id="bSave">Save note</button>' +
      '</div>';

    $('dClose').onclick = closeDrawer;
    $('bSave').onclick = function(){ patch({ note: $('note').value, handled_by: $('handledBy').value }); };
    $('bClaim').onclick = function(){ patch({ status: 'claimed', handled_by: $('handledBy').value, note: $('note').value }); };
    $('bClose').onclick = function(){ patch({ status: 'closed', handled_by: $('handledBy').value, note: $('note').value }); };
    $('bArchive').onclick = function(){ patch({ status: 'archived' }); };

    d.classList.add('open');
    $('overlay').classList.add('open');
  }

  function patch(p){
    if (!current) return;
    p.id = current.id;
    api('', { method: 'PATCH', body: p }).then(function(d){
      if (!d.ok) { fail(d.error || 'Update failed'); return; }
      load();
      if (p.status === 'claimed') alert('Marked as taken over. Reply to ' + (current.email || 'the visitor') +
        ' from your mailbox — this page is the record, not the mail client.');
      closeDrawer();
    }).catch(function(e){ fail(String(e)); });
  }

  function closeDrawer(){
    $('drawer').classList.remove('open');
    $('overlay').classList.remove('open');
  }

  $('btnRefresh').onclick = load;
  $('overlay').onclick = closeDrawer;
  $('btnToken').onclick = function(){
    var v = prompt('Admin token (stored locally as ' + TOKEN_KEY + ')', token);
    if (v !== null) { token = v.trim(); localStorage.setItem(TOKEN_KEY, token); load(); }
  };
  $('fStatus').onchange = load;
  $('fQ').onkeydown = function(e){ if (e.key === 'Enter') load(); };
  $('btnPurge').onclick = function(){
    var days = Math.max(30, parseInt($('purgeDays').value, 10) || 180);
    if (!confirm('Permanently delete every conversation older than ' + days + ' days?\n\n' +
                 'This cannot be undone and exists to honour the retention promise in the privacy policy.')) return;
    api('?days=' + days, { method: 'DELETE' }).then(function(d){
      if (!d.ok) { fail(d.error || 'Purge failed'); return; }
      load();
      $('err').innerHTML = '<div class="err" style="border-color:#2b7a2b;color:#8fe38f;background:rgba(22,163,74,.12)">Deleted ' +
        esc(d.deleted) + ' conversations older than ' + esc(d.days) + ' days.</div>';
    }).catch(function(e){ fail(String(e)); });
  };

  load();
})();
</script>
</body>
</html>
